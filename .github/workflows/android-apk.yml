name: Build Android APK

# Gera o APK do ALXmovies e publica em "Releases" (dá pra baixar direto pelo celular).
# Dispara: ao enviar o .zip do projeto / mexer no projeto, ou manualmente em Actions → Build Android APK → Run workflow.
on:
  push:
    branches: [main, master]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Se houver um arquivo .zip na raiz do repositório (ex.: alxmovies-android.zip), o app é descompactado dele.
      # Isso permite subir o projeto inteiro pelo celular, com um único arquivo.
      - name: Localizar o projeto
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP" ]; then
            echo "Descompactando $ZIP"
            rm -rf _app && mkdir _app && unzip -q "$ZIP" -d _app
            DIR=_app
            if [ ! -f "$DIR/package.json" ]; then
              SUB=$(find _app -maxdepth 2 -name package.json -not -path "*/node_modules/*" | head -1)
              [ -n "$SUB" ] && DIR=$(dirname "$SUB")
            fi
            echo "APP_DIR=$DIR" >> "$GITHUB_ENV"
          else
            echo "APP_DIR=." >> "$GITHUB_ENV"
          fi
          grep APP_DIR "$GITHUB_ENV"
          test -f "$(grep APP_DIR "$GITHUB_ENV" | cut -d= -f2)/package.json" || { echo "✗ package.json não encontrado: envie o projeto (zip) para o repositório."; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Compilar o site (Vite)
        working-directory: ${{ env.APP_DIR }}
        env:
          # Padrão: proxy DESLIGADO (variável vazia = tudo direto, como antes). Para ligar crie a variável VITE_USE_PROXY = true.
          VITE_USE_PROXY: ${{ vars.VITE_USE_PROXY }}
          # Start.io: modo de TESTE (anúncios de mentira). Para anúncios reais crie a variável ADS_TEST = false.
          VITE_ADS_TEST: ${{ vars.ADS_TEST }}
        run: npm run build

      - name: Criar o projeto Android (Capacitor)
        working-directory: ${{ env.APP_DIR }}
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      # Push com o app fechado (opcional): só se o secret GOOGLE_SERVICES_JSON existir. Sem ele o APK compila normal, sem Firebase.
      - name: Firebase (google-services.json)
        working-directory: ${{ env.APP_DIR }}
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > android/app/google-services.json && echo "Firebase ligado."; else echo "Sem Firebase (secret não cadastrado)."; fi

      - name: Ícone e tela de abertura
        working-directory: ${{ env.APP_DIR }}
        run: npx --yes @capacitor/assets generate --android || echo "⚠ Não foi possível gerar ícones; usando o padrão."

      # Versão = MAIOR.MENOR (arquivo version.txt, ex.: 1.1) + número que sobe a cada build e volta a 0 quando o MAIOR.MENOR muda.
      # Para ir de 1.1.x para 1.2.0 basta trocar o conteúdo de version.txt para 1.2.
      - name: Definir a versão
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(tr -d ' \r\n' < version.txt 2>/dev/null || true)
          [[ "$BASE" =~ ^[0-9]+\.[0-9]+$ ]] || BASE="1.0"
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          LAST=${LAST#v}
          PATCH=0
          if [[ "$LAST" =~ ^([0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            LBASE="${BASH_REMATCH[1]}"; LPATCH="${BASH_REMATCH[2]}"
            # nunca volta para uma versão menor que a última publicada
            if [ "$BASE" != "$LBASE" ] && [ "$(printf '%s\n%s\n' "$BASE" "$LBASE" | sort -V | tail -1)" = "$LBASE" ]; then
              echo "⚠ version.txt ($BASE) é menor que a última versão ($LAST); mantendo $LBASE."
              BASE="$LBASE"
            fi
            if [ "$BASE" = "$LBASE" ]; then PATCH=$((LPATCH + 1)); fi
          fi
          echo "VERSION=$BASE.$PATCH" >> "$GITHUB_ENV"
          echo "Versão deste build: $BASE.$PATCH (última publicada: ${LAST:-nenhuma})"

      # Novidades que aparecem na tela de atualização (arquivo release-notes.md do projeto).
      - name: Novidades da versão
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -s release-notes.md ]; then
            printf '## Melhorado\n- Melhorias de desempenho e correções\n' > release-notes.md
          fi
          cat release-notes.md

      - name: Ajustar o projeto Android
        working-directory: ${{ env.APP_DIR }}
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.VERSION }}
          VITE_USE_PROXY: ${{ vars.VITE_USE_PROXY }}
        run: node scripts/android/patch-android.mjs

      - name: Aceitar licenças e instalar o SDK do Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Compilar o APK (Gradle)
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Alinhar e assinar o APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK sem assinatura: $UNSIGNED"

          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            KS=release.keystore; ALIAS="$KS_ALIAS"; PASS="$KS_PASS"
            echo "Assinando com a SUA chave (secrets)."
          else
            KS=keystore/alxmovies-sideload.p12; ALIAS=alxmovies; PASS=alxmovies123
            echo "Assinando com a chave de teste do repositório (serve para instalar direto no celular)."
          fi

          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out ALXmovies.apk aligned.apk
          "$BT/apksigner" verify --verbose ALXmovies.apk | head -5
          echo "=============================================================="
          echo "LINKS QUE ABREM O APP (App Links)"
          HEX=$("$BT/apksigner" verify --print-certs ALXmovies.apk | grep -i "SHA-256 digest" | head -1 | sed 's/.*: *//' | tr 'a-f' 'A-F')
          FP=$(echo "$HEX" | sed 's/../&:/g; s/:$//')
          echo "Impressão digital da chave que assinou este APK:"
          echo "$FP"
          echo ""
          echo "Conteúdo pronto para public/.well-known/assetlinks.json:"
          echo '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.alxmovies.app","sha256_cert_fingerprints":["'"$FP"'"]}}]'
          echo "=============================================================="
          ls -la ALXmovies.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ALXmovies-apk
          path: ${{ env.APP_DIR }}/ALXmovies.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ALXmovies ${{ env.VERSION }}
          body_path: ${{ env.APP_DIR }}/release-notes.md
          files: ${{ env.APP_DIR }}/ALXmovies.apk

      # Avisa os celulares (push do Firebase) que existe versão nova. Só roda se os 2 secrets abaixo existirem.
      - name: Avisar celulares (push)
        continue-on-error: true
        env:
          PUSH_SEND_URL: ${{ secrets.PUSH_SEND_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: |
          if [ -z "$PUSH_SEND_URL" ] || [ -z "$PUSH_SECRET" ]; then echo "Push de atualização não configurado (secrets PUSH_SEND_URL e PUSH_SECRET) — pulando."; exit 0; fi
          sleep 15
          curl -fsS -X POST "$PUSH_SEND_URL" \
            -H "x-push-secret: $PUSH_SECRET" -H "Content-Type: application/json" \
            -d '{"table":"app_update","record":{"version":"${{ env.VERSION }}"}}'
            
