name: Build Android APK

# Gera o APK do ALXmovies e publica em "Releases" (dá pra baixar direto pelo celular).
# Dispara: ao enviar o .zip do projeto / mexer no projeto, ou manualmente em Actions → Build Android APK → Run workflow.
on:
  push:
    branches: [main, master]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # A assinatura é SEMPRE a sua chave (secrets do GitHub). Não existe mais chave de teste: sem os 3 secrets o build para aqui, avisando.
      - name: Verificar a chave de assinatura (secrets)
        run: |
          MISSING=""
          [ -z "$KS_B64" ]   && MISSING="$MISSING ANDROID_KEYSTORE_BASE64"
          [ -z "$KS_ALIAS" ] && MISSING="$MISSING ANDROID_KEY_ALIAS"
          [ -z "$KS_PASS" ]  && MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Faltam secrets no GitHub:$MISSING. Cadastre em Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Os 3 secrets da chave de assinatura estão cadastrados."

      # Se houver um arquivo .zip na raiz do repositório (ex.: alxmovies-android.zip), o app é descompactado dele.
      # Isso permite subir o projeto inteiro pelo celular, com um único arquivo.
      - name: Localizar o projeto
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP" ]; then
            echo "Descompactando $ZIP"
            rm -rf _app && mkdir _app && unzip -q "$ZIP" -d _app
            DIR=_app
            if [ ! -f "$DIR/package.json" ]; then
              SUB=$(find _app -maxdepth 2 -name package.json -not -path "*/node_modules/*" | head -1)
              [ -n "$SUB" ] && DIR=$(dirname "$SUB")
            fi
            echo "APP_DIR=$DIR" >> "$GITHUB_ENV"
          else
            echo "APP_DIR=." >> "$GITHUB_ENV"
          fi
          grep APP_DIR "$GITHUB_ENV"
          test -f "$(grep APP_DIR "$GITHUB_ENV" | cut -d= -f2)/package.json" || { echo "✗ package.json não encontrado: envie o projeto (zip) para o repositório."; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund

      - name: Compilar o site (Vite)
        working-directory: ${{ env.APP_DIR }}
        env:
          # Padrão: proxy DESLIGADO (variável vazia = tudo direto, como antes). Para ligar crie a variável VITE_USE_PROXY = true.
          VITE_USE_PROXY: ${{ vars.VITE_USE_PROXY }}
        run: npm run build

      # Mostra as impressões digitais (SHA-1 e SHA-256) da SUA chave de assinatura e grava o SHA-256 no assetlinks.json do site.
      # SHA-1   -> Google Cloud: cliente OAuth do tipo Android (pacote com.alxmovies.app), para o Login com Google.
      # SHA-256 -> Android App Links: vai para https://SEU-SITE/.well-known/assetlinks.json (gerado aqui, antes de publicar o site).
      # Aparece no "Resumo" no alto da página desta execução (Actions → clique na execução) e nos avisos azuis.
      - name: Chave de assinatura (SHA-1 e SHA-256) e assetlinks.json
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "$KS_B64" | base64 -d > release.keystore
          if ! INFO=$(keytool -list -v -keystore release.keystore -alias "$KS_ALIAS" -storepass "$KS_PASS" 2>&1); then
            echo "::error::Não consegui abrir a chave de assinatura. Confira os secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS e ANDROID_KEYSTORE_PASSWORD."
            echo "$INFO" | tail -3
            exit 1
          fi
          SHA1=$(echo "$INFO" | grep -m1 "SHA1:" | sed 's/.*SHA1: *//' | tr -d ' ')
          SHA256=$(echo "$INFO" | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d ' ')
          [ -n "$SHA1" ] && [ -n "$SHA256" ] || { echo "::error::Não consegui ler o SHA-1/SHA-256 da chave."; exit 1; }

          echo ""
          echo "==============================================================="
          echo "  SHA-1   (Google Cloud, cliente Android): $SHA1"
          echo "  SHA-256 (App Links / assetlinks.json):   $SHA256"
          echo "==============================================================="
          echo "::notice title=SHA-1 da chave (Google Cloud)::$SHA1"
          echo "::notice title=SHA-256 da chave (assetlinks.json)::$SHA256"
          {
            echo "### 🔑 Chave de assinatura do ALXmovies"
            echo ""
            echo "| | Valor |"
            echo "|---|---|"
            echo "| **SHA-1** | \`$SHA1\` |"
            echo "| **SHA-256** | \`$SHA256\` |"
            echo ""
            echo "- **SHA-1**: Google Cloud → Credenciais → ID do cliente OAuth do tipo **Android** (pacote \`com.alxmovies.app\`)."
            echo "- **SHA-256**: já foi gravado em \`/.well-known/assetlinks.json\` do site neste build."
          } >> "$GITHUB_STEP_SUMMARY"

          mkdir -p dist/.well-known
          printf '[\n  {\n    "relation": ["delegate_permission/common.handle_all_urls"],\n    "target": {\n      "namespace": "android_app",\n      "package_name": "com.alxmovies.app",\n      "sha256_cert_fingerprints": [\n        "%s"\n      ]\n    }\n  }\n]\n' "$SHA256" > dist/.well-known/assetlinks.json
          echo "assetlinks.json do site:"; cat dist/.well-known/assetlinks.json

      # Publica o SITE no Netlify (alxmovies.netlify.app) com o que acabou de ser compilado. Só roda se o secret NETLIFY_AUTH_TOKEN existir.
      # Sem o secret, esta etapa é pulada e o APK sai normalmente.
      - name: Publicar o site no Netlify
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        working-directory: ${{ env.APP_DIR }}
        env:
          NETLIFY_SITE_ID: 9082726b-f428-4db4-bb90-b5eccf56ce51
        run: npx --yes netlify-cli@latest deploy --prod --dir=dist --no-build --message "ALXmovies ${GITHUB_SHA::7}"

      - name: Criar o projeto Android (Capacitor)
        working-directory: ${{ env.APP_DIR }}
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      # Push com o app fechado (opcional): só se o secret GOOGLE_SERVICES_JSON existir. Sem ele o APK compila normal, sem Firebase.
      - name: Firebase (google-services.json)
        working-directory: ${{ env.APP_DIR }}
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > android/app/google-services.json && echo "Firebase ligado."; else echo "Sem Firebase (secret não cadastrado)."; fi

      - name: Ícone e tela de abertura
        working-directory: ${{ env.APP_DIR }}
        run: npx --yes @capacitor/assets generate --android || echo "⚠ Não foi possível gerar ícones; usando o padrão."

      # Versão = MAIOR.MENOR (arquivo version.txt, ex.: 1.1) + número que sobe a cada build e volta a 0 quando o MAIOR.MENOR muda.
      # Para ir de 1.1.x para 1.2.0 basta trocar o conteúdo de version.txt para 1.2.
      - name: Definir a versão
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE=$(tr -d ' \r\n' < version.txt 2>/dev/null || true)
          [[ "$BASE" =~ ^[0-9]+\.[0-9]+$ ]] || BASE="1.0"
          LAST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          LAST=${LAST#v}
          PATCH=0
          if [[ "$LAST" =~ ^([0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            LBASE="${BASH_REMATCH[1]}"; LPATCH="${BASH_REMATCH[2]}"
            # nunca volta para uma versão menor que a última publicada
            if [ "$BASE" != "$LBASE" ] && [ "$(printf '%s\n%s\n' "$BASE" "$LBASE" | sort -V | tail -1)" = "$LBASE" ]; then
              echo "⚠ version.txt ($BASE) é menor que a última versão ($LAST); mantendo $LBASE."
              BASE="$LBASE"
            fi
            if [ "$BASE" = "$LBASE" ]; then PATCH=$((LPATCH + 1)); fi
          fi
          echo "VERSION=$BASE.$PATCH" >> "$GITHUB_ENV"
          echo "Versão deste build: $BASE.$PATCH (última publicada: ${LAST:-nenhuma})"

      # Novidades que aparecem na tela de atualização (arquivo release-notes.md do projeto).
      - name: Novidades da versão
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -s release-notes.md ]; then
            printf '## Melhorado\n- Melhorias de desempenho e correções\n' > release-notes.md
          fi
          cat release-notes.md

      - name: Ajustar o projeto Android
        working-directory: ${{ env.APP_DIR }}
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.VERSION }}
          VITE_USE_PROXY: ${{ vars.VITE_USE_PROXY }}
        run: node scripts/android/patch-android.mjs

      # Libera espaço no disco do GitHub (o build do Android é pesado e pode faltar espaço). Remove só o que não usamos.
      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift || true
          df -h / | tail -1

      - name: Aceitar licenças e instalar o SDK do Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Compilar o APK (Gradle)
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # Só roda se o build falhar: mostra a CAUSA em poucas linhas (copie daqui em vez de procurar no log enorme).
      - name: Resumo do erro (aparece só se falhar)
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gradle.log"
          echo "===== Espaço em disco ====="
          df -h / | tail -2
          if [ -f "$LOG" ]; then
            echo "===== O que deu errado ====="
            grep -n -A 12 "What went wrong" "$LOG" | head -40 || true
            echo "===== Causas (Caused by) ====="
            grep -n "Caused by" "$LOG" | head -15 || true
            echo "===== Erros de compilação ====="
            grep -n "error:" "$LOG" | head -15 || true
          else
            echo "O log do Gradle não existe (a falha foi antes dele)."
          fi

      - name: Alinhar e assinar o APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK sem assinatura: $UNSIGNED"

          # Assina com a SUA chave (secrets). Não existe mais chave de teste.
          echo "$KS_B64" | base64 -d > release.keystore
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$KS_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out ALXmovies.apk aligned.apk
          "$BT/apksigner" verify --verbose ALXmovies.apk | head -5

          CERTS=$("$BT/apksigner" verify --print-certs ALXmovies.apk)
          fmt() { echo "$1" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//'; }
          S1=$(fmt "$(echo "$CERTS" | grep -i "SHA-1 digest" | head -1 | sed 's/.*: *//')")
          S256=$(fmt "$(echo "$CERTS" | grep -i "SHA-256 digest" | head -1 | sed 's/.*: *//')")
          echo "==============================================================="
          echo "Chave que assinou este APK:"
          echo "  SHA-1:   $S1"
          echo "  SHA-256: $S256"
          echo "==============================================================="
          ls -la ALXmovies.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ALXmovies-apk
          path: ${{ env.APP_DIR }}/ALXmovies.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ALXmovies ${{ env.VERSION }}
          body_path: ${{ env.APP_DIR }}/release-notes.md
          files: ${{ env.APP_DIR }}/ALXmovies.apk

      # Avisa os celulares (push do Firebase) que existe versão nova. Só roda se os 2 secrets abaixo existirem.
      - name: Avisar celulares (push)
        continue-on-error: true
        env:
          PUSH_SEND_URL: ${{ secrets.PUSH_SEND_URL }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
        run: |
          if [ -z "$PUSH_SEND_URL" ] || [ -z "$PUSH_SECRET" ]; then echo "Push de atualização não configurado (secrets PUSH_SEND_URL e PUSH_SECRET) — pulando."; exit 0; fi
          sleep 15
          curl -fsS -X POST "$PUSH_SEND_URL" \
            -H "x-push-secret: $PUSH_SECRET" -H "Content-Type: application/json" \
            -d '{"table":"app_update","record":{"version":"${{ env.VERSION }}"}}'
            
