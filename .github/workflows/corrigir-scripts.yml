name: Restaurar scripts/android e validar o build

# Temporário. Roda ao enviar a branch "corrigir-scripts-android":
#  1. restaura a pasta scripts/android (que o .gitignore antigo "android/" tinha deixado de fora) a partir do .zip no histórico;
#  2. roda o build do APK inteiro SEM assinar (site, Capacitor, patch, Gradle) para provar que funciona;
#  3. só se tudo passar, grava os arquivos (commit). Se falhar, grava só o ERRO-DO-BUILD.txt com o fim do log.
on:
  push:
    branches: [corrigir-scripts-android]

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LOG: /tmp/passos.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar scripts/android do zip antigo (histórico do Git)
        run: |
          set -euo pipefail
          git show eaf1548583d450e6d1980fcfdcc719a0e5a9d470:alxmovies-android-1.zip > /tmp/antigo.zip
          rm -rf /tmp/z && mkdir /tmp/z && unzip -q /tmp/antigo.zip -d /tmp/z
          SUB=$(find /tmp/z -maxdepth 2 -name package.json -not -path "*/node_modules/*" | head -1)
          [ -n "$SUB" ] || { echo "✗ package.json não encontrado no zip antigo"; exit 1; }
          mkdir -p scripts
          cp -r "$(dirname "$SUB")/scripts/android" scripts/
          ls -la scripts/android
          node --check scripts/android/patch-android.mjs
          echo "✓ scripts/android restaurado"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validar o build do APK (sem assinar)
        run: |
          set -eo pipefail
          {
            npm install --no-audit --no-fund
            npm run build
            npx cap add android
            npx cap sync android
            (npx --yes @capacitor/assets generate --android || echo "aviso: sem icones")
            VERSION_CODE=1 VERSION_NAME=1.0.0 node scripts/android/patch-android.mjs
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          } 2>&1 | tee "$LOG"

      - name: Gravar (commit) os arquivos restaurados
        run: |
          set -euo pipefail
          rm -f package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -q -F - <<'MSG'
          Restaurar scripts/android (faltava no repositório) e corrigir o .gitignore

          O .gitignore tinha "android/", que também ignorava scripts/android/ (patch-android.mjs,
          plugins Java e ícone da abertura). Agora a regra é "/android/" (só a pasta gerada na raiz).
          O build do APK inteiro (sem assinar) foi rodado antes deste commit e passou.

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_013GAnrFuK1xoyBZxfYd4YDF
          MSG
          git push

      - name: Guardar o erro para análise
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -s "$LOG" ]; then tail -n 150 "$LOG" > ERRO-DO-BUILD.txt; else echo "Falhou antes da validação (ver o passo vermelho em Actions)." > ERRO-DO-BUILD.txt; fi
          git add -f ERRO-DO-BUILD.txt
          git commit -q -m "Log do erro do build (temporário)"
          git push
