name: Migrar projeto do zip para arquivos

# Roda sozinho UMA vez, ao enviar a branch "projeto-em-arquivos":
#  1. descompacta o .zip da raiz e coloca o projeto em arquivos soltos no repositório;
#  2. apaga o .zip e a pasta antiga alxmovies/;
#  3. aplica a nova tela inicial (pasta overrides/);
#  4. confere que o app compila — só se compilar é que grava (commit). Se algo falhar, nada é gravado.
on:
  push:
    branches: [projeto-em-arquivos]

permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o zip e organizar os arquivos
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          [ -n "$ZIP" ] || { echo "✗ Nenhum .zip na raiz: nada a migrar."; exit 1; }
          echo "Zip: $ZIP"

          rm -rf /tmp/proj && mkdir /tmp/proj && unzip -q "$ZIP" -d /tmp/proj
          DIR=/tmp/proj
          if [ ! -f "$DIR/package.json" ]; then
            SUB=$(find /tmp/proj -maxdepth 2 -name package.json -not -path "*/node_modules/*" | head -1)
            [ -n "$SUB" ] || { echo "✗ package.json não encontrado dentro do zip."; exit 1; }
            DIR=$(dirname "$SUB")
          fi
          echo "Projeto em: $DIR"

          # apaga o que havia: o zip e a pasta antiga alxmovies/
          git rm -rq --ignore-unmatch alxmovies "$ZIP"

          # copia o projeto para a raiz (sem a pasta .github: o workflow do APK já está no repositório)
          rsync -a --exclude='.github' "$DIR"/ ./

          # nova tela inicial
          python3 overrides/patch-home.py src/pages/Home.tsx
          cp overrides/src/components/HeroCarousel.tsx src/components/HeroCarousel.tsx
          cp overrides/src/styles/home-v2.css src/styles/home-v2.css
          rm -rf overrides

          test -f package.json
          echo "Arquivos na raiz:" && ls -A

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Conferir tipos (só avisa, não bloqueia)
        run: npm run typecheck || echo "⚠ O TypeScript apontou avisos acima (o build abaixo é o que decide)."

      - name: Compilar o site (Vite) — se falhar, nada é gravado
        run: npm run build

      - name: Gravar (commit) na branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short | head -15
          echo "... total de arquivos alterados: $(git status --short | wc -l)"
          git commit -q -F - <<'MSG'
          Projeto passa a ficar em arquivos (sai o .zip) + nova tela inicial

          - descompacta alxmovies-android-1.zip na raiz do repositório
          - remove o .zip e a pasta antiga alxmovies/
          - nova tela inicial: destaques com Assistir/Detalhes, atalhos e Top 10

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_013GAnrFuK1xoyBZxfYd4YDF
          MSG
          git push
